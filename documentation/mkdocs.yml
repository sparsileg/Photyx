site_name:  Photyx Help
site_description: Help documentation for Photyx
docs_dir: docs
site_dir: site
use_directory_urls: false

theme:
  name: material
  logo: assets/photyx_icon_1024.png
  favicon: assets/photyx_icon_1024.png
  font: false
  palette:
    scheme: slate
    primary: black
    accent: deep purple
  features:
    - navigation.instant
    - navigation.top
    - navigation.expand
    - navigation.footer
    - toc.integrate
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.sections
    - navigation.indexes

nav:
  - Home: index.md
  - Your First Session: 1-your-first-session.md
  - Automating with Pcode: 2-automating-with-pcode.md
  - Macros and Multiple Sessions: 3-multi-session-project.md
  - Command Reference:
      - Overview: reference/index.md
      - Language Basics: reference/language-basics.md
      - Session Commands: reference/session-commands.md
      - Write & Export Commands: reference/write-export-commands.md
      - Keyword Commands: reference/keyword-commands.md
      - Analysis Commands: reference/analysis-commands.md
      - Image Processing: reference/image-processing.md
      - Stacking Commands: reference/stacking-commands.md
      - Display & Navigation: reference/display-navigation.md
      - Scripting Utilities: reference/scripting-utilities.md
      - Complete Examples: reference/examples.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.critic
  - pymdownx.arithmatex

plugins:
  - search:
      lang: en
      separator: '[\s\-]+'
  - offline
  - awesome-pages
  - glightbox
